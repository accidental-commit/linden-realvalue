name: Update LindeX Rate

on:
  schedule:
    # Run at minute 10 of every hour
    - cron: '10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-rate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and calculate latest LindeX rate
        run: node scripts/update-rate.js

      - name: Commit and push if rate changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rate.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update LindeX exchange rate [skip ci]" && git push)

