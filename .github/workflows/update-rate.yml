name: Update LindeX Rate

on:
  schedule:
    # Run at minute 10 of every hour
    - cron: '10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-rate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and calculate latest LindeX rate
        run: node scripts/update-rate.js

      - name: Commit and push if rate changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rate.json
          # 1. Temporary push to master (keeps v1.0.1 working during store review transition)
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update LindeX exchange rate [skip ci]" && git push origin master)
          # 2. Push single isolated commit to data branch (for v1.0.2+)
          git checkout --orphan data_live
          git rm -rf . --quiet
          git checkout master -- rate.json
          git add rate.json
          git commit -m "Live LindeX rate feed [skip ci]"
          git push -f origin data_live:data

