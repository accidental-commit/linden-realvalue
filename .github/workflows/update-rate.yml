name: Update LindeX Rate

on:
  schedule:
    # Run at minute 10 of every hour
    - cron: '10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-rate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and calculate latest LindeX rate
        run: node scripts/update-rate.js

      - name: Publish rate feed to data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data_live
          git rm --cached -rf . --quiet
          git add rate.json
          git commit -m "Live LindeX rate feed [skip ci]"
          for attempt in 1 2 3; do
            if git push -f origin data_live:data; then
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying in 3s..."
            sleep 3
          done
          exit 1

